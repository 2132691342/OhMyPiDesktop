version: '3'

# Windows 专用的构建与运行。
#
# 只面向 Windows：不做 darwin/linux/ios 的交叉编译，也不出 msix / sign。
# 出 NSIS 安装器（wails3 package 驱动下面的 create:nsis:installer），
# 把构建好的便携 exe 包成可双击安装、可卸载的程序。

includes:
  common: ../Taskfile.yml

vars:
  # 只面向 Windows：GOOS 固定，构建不派发到其它平台。
  GOOS: "windows"

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
    vars:
      # VERSION 从 git 描述取：tag 上构建就是 tag 号，否则是短 hash + 距离。
      # 不这么做的话，界面上报的还是那个写死的 0.1.0，与发布出去的 tag 对不上。
      VERSION:
        sh: 'git describe --tags --always --dirty 2>/dev/null || echo dev'
      # 版本号写进 main.version，-X 只能跟在 -ldflags 后面，所以要拼进同一串。
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.version={{.VERSION}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '0'

  generate:syso:
    summary: Generates the Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  # NSIS 安装器：把构建好的便携 exe 包成可双击安装的程序。
  # 不走 v2 的 `-nsis`（那是 v2 的 flag）；v3 用 `wails3 package` 驱动这里。
  # INSTALL_SCOPE=machine 装到 Program Files（需 UAC）；=user 装到 %LOCALAPPDATA%（免 UAC）。
  package:
    summary: Packages the application as an NSIS installer
    cmds:
      - task: create:nsis:installer
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    vars:
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  create:nsis:installer:
    summary: Creates the NSIS installer from the built exe
    dir: build/windows/nsis
    deps:
      - task: build
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine', got '{{.INSTALL_SCOPE}}'"
    cmds:
      # WebView2 引导程序：本机没有 WebView2 运行时时由安装器静默拉取。
      - wails3 generate webview2bootstrapper -dir .
      - |
        {{if eq OS "windows"}}
        makensis -DINFO_PROJECTNAME="{{.APP_NAME}}" -DINFO_PRODUCTNAME="{{.APP_NAME}}" -DINFO_COMPANYNAME="{{.APP_NAME}}" -DINFO_PRODUCTVERSION="{{.VERSION}}" -DINFO_COPYRIGHT="Copyright (c) 2026" {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_AMD64_BINARY="..\..\..\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis -DINFO_PROJECTNAME="{{.APP_NAME}}" -DINFO_PRODUCTNAME="{{.APP_NAME}}" -DINFO_COMPANYNAME="{{.APP_NAME}}" -DINFO_PRODUCTVERSION="{{.VERSION}}" -DINFO_COPYRIGHT="Copyright (c) 2026" {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_AMD64_BINARY="../..\/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      # 取最近一个 tag 的三段版本号；没打 tag 时退回 1.0.0，仅影响安装包版本戳。
      # 不能用 `git ... | sed || echo`：管道里 git 失败会被 sed 的退出码掩盖，导致版本号为空。
      VERSION:
        sh: 'v=$(git describe --tags --abbrev=0 2>/dev/null || echo 1.0.0); echo "${v#v}"'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  run:
    summary: Runs the built application
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
