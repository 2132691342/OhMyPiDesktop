version: '3'

# 构建期公用任务。只面向 Windows，所以平台差异全在 build/windows/Taskfile.yml。
#
# 这里不写 darwin / linux / ios / docker / nsis / msix：那些任务在本项目里
# 永远不会被执行，留着只是让「这个项目支持什么平台」这件事变得含糊。

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    cmds:
      - task: install:frontend:deps:npm

  install:frontend:deps:npm:
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "npm 没装。Node.js 自带 npm：https://nodejs.org/en/download/"
    cmds:
      - npm install

  build:frontend:
    summary: Build the frontend production bundle
    # run:once：dev 模式会并行跑两次（一次出 dist，一次给 Vite），
    # 不加它两个进程会同时删改 frontend/bindings，间歇性失败。
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true{{if eq .OBFUSCATED "true"}} -obfuscated{{end}} -ts -i

  generate:icons:
    # 只面向 Windows：不生成 darwin 的 icns 与 Assets.car，也就不需要 appicon.icon。
    # 路径从仓库根算起（不设 dir），否则默认输出 build/darwin/... 会落到 build/build 下。
    summary: Generates the Windows `.ico` from `build/appicon.png`
    run: once
    sources:
      - "build/appicon.png"
    generates:
      - "build/windows/icon.ico"
    cmds:
      - wails3 generate icons -input build/appicon.png -windowsfilename build/windows/icon.ico -macfilename build/windows/.icns.tmp

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
