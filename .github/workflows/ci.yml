# 质量门禁：push main 与 PR 上跑完整验证链。
# 只验证、从不发版：发版只由 release.yml 在 tag 上触发。
name: ci

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        # 生成绑定要用 wails3。版本跟 go.mod 里依赖的 wails v3 保持一致：
        # 生成器的输出格式随版本变，不同版本生成的文件不能互认。
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Verify bindings are in sync
        shell: pwsh
        # 绑定漂移是静默故障：前端拿到的绑定 id 与后端注册的对不上时，
        # 编译、类型检查、单元测试全都绿，只有真在 WebView 里点一下才知道。
        # 所以这里重新生成一遍，要求工作区干净——
        # 不干净就说明生成物没跟着代码一起提交。
        run: |
          wails3 generate bindings -clean=true -ts -i
          git diff --exit-code -- frontend/bindings
          if ($LASTEXITCODE -ne 0) {
            Write-Host "绑定生成物与代码不一致：重新生成后请提交 frontend/bindings"
            exit 1
          }

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        # main 包 //go:embed frontend/dist：不先建前端，go build 直接失败。
        # vue-tsc --noEmit 是硬门禁，类型错误在这里就拦住。
        run: npm run build
        working-directory: frontend

      - name: gofmt
        shell: pwsh
        # 仓库统一 LF 行尾（.gitattributes），本地与 CI 的 gofmt -l 表现一致。
        run: |
          $bad = gofmt -l backend main.go tools
          if ($bad) { Write-Host "未格式化（gofmt -w 后重提）："; Write-Host $bad; exit 1 }

      - name: vet
        run: go vet ./backend/... ./tools/...

      - name: test
        # 全量：只测会悄无声息出错的地方（协议翻译顺序、块下标、工具结果回填、
        # 分片重组、环形重放对账、会话文件适配）。
        run: go test ./backend/... -count=1

      - name: build
        run: go build ./backend/... ./tools/...
