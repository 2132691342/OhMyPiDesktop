# 发版：只由 tag 触发（push main 与 PR 不触发，那是 ci.yml 的职责）。
# tag 形如 v1.0.0，必须指向 main 上的提交。
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXE: bin/OhMyPiDesktop.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify static gate
        shell: pwsh
        # 测试矩阵已由 main 上的 ci.yml 门禁（tag 必经 main）覆盖，这里只重验编译：
        # 再跑一遍全量测试是重复劳动，wails build 自己会构建前端。
        # 只门后端：main 包 //go:embed frontend/dist，而 dist 此刻还不存在（由 wails build 生成）。
        run: |
          # 仓库统一 LF 行尾（.gitattributes），详见 ci.yml 的 gofmt 步骤
          $bad = gofmt -l backend main.go assets.go tray.go tools
          if ($bad) { throw "gofmt 未通过:`n$bad" }
          go vet ./backend/... ./tools/...
          if ($LASTEXITCODE -ne 0) { throw "go vet 失败" }
          go build ./backend/... ./tools/...
          if ($LASTEXITCODE -ne 0) { throw "go build 失败" }

      - name: Wails build
        shell: pwsh
        # v3 用 Taskfile 驱动，产物落在仓库根的 bin/（不是 build/bin/）。
        # 不出安装器：本项目只发便携 exe。
        # 不加 -clean：v3 的 build 没有这个标志（那是 v2 的），加了会直接报错退出。
        run: wails3 build

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path $env:EXE)) { throw "wails build 没产出 $([System.IO.Path]::GetFileName($env:EXE))" }
          $exeMB = (Get-Item $env:EXE).Length / 1MB
          if ($exeMB -lt 3) { throw ("$([System.IO.Path]::GetFileName($env:EXE)) 只有 {0:N1} MB，构建产物疑似不完整" -f $exeMB) }
          Write-Host ("Artifact OK (exe {0:N1} MB)" -f $exeMB)

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ohmypidesktop-windows-debug
          # v3 的产物在仓库根的 bin/（build/bin/ 是 v2 的位置，已经不用了）。
          path: bin/
          retention-days: 7

      - name: Create GitHub Release
        # 触发条件已是 tag，这里再判一次：防「tag 被事后移动」时产物与版本号对不上。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: OhMyPiDesktop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: bin/OhMyPiDesktop.exe
