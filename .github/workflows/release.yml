# 发版：只由 tag 触发（push main 与 PR 不触发，那是 ci.yml 的职责）。
# tag 形如 v1.0.0，必须指向 main 上的提交。
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXE: bin/OhMyPiDesktop.exe
      INSTALLER: bin/OhMyPiDesktop-amd64-installer.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install NSIS (makensis)
        shell: pwsh
        # 安装器靠 makensis 打包。nsis 的 chocolatey 包把 makensis.exe 装到
        # C:\Program Files (x86)\NSIS（也可能在 C:\ProgramData\chocolatey\bin 留 shim），
        # 两个目录都加进 PATH 才保险。choco 失败不能静默吞掉（否则后续步骤拿不到退出码）。
        # 两条路都不通时回退到官方 NSIS 便携 zip。
        run: |
          $candidates = @('C:\ProgramData\chocolatey\bin', 'C:\Program Files (x86)\NSIS')
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            try { choco install nsis -y } catch { Write-Host "choco install nsis failed: $_" }
          }
          foreach ($d in $candidates) {
            if (Test-Path (Join-Path $d 'makensis.exe')) {
              Add-Content -Path $env:GITHUB_PATH -Value $d
            }
          }
          if (-not (Test-Path (Join-Path $candidates[0] 'makensis.exe')) -and -not (Test-Path (Join-Path $candidates[1] 'makensis.exe'))) {
            # 兜底：官方 NSIS 便携版（解压即得 makensis.exe）。
            $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
            Invoke-WebRequest -Uri 'https://sourceforge.net/projects/nsis/files/NSIS%203/3.11/nsis-3.11.zip/download' -OutFile $zip
            $base = Join-Path $env:RUNNER_TEMP 'nsis'
            Expand-Archive -Path $zip -DestinationPath $base -Force
            $mk = Get-ChildItem $base -Recurse -Filter 'makensis.exe' | Select-Object -First 1
            if (-not $mk) { throw 'NSIS 下载解压后仍未找到 makensis.exe' }
            Add-Content -Path $env:GITHUB_PATH -Value $mk.DirectoryName
          }
          Write-Host "NSIS ready: $((Get-ChildItem $candidates -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName)"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify static gate
        shell: pwsh
        # 测试矩阵已由 main 上的 ci.yml 门禁（tag 必经 main）覆盖，这里只重验编译：
        # 再跑一遍全量测试是重复劳动，wails build 自己会构建前端。
        # 只门后端：main 包 //go:embed frontend/dist，而 dist 此刻还不存在（由 wails build 生成）。
        run: |
          # 仓库统一 LF 行尾（.gitattributes），详见 ci.yml 的 gofmt 步骤
          $bad = gofmt -l backend main.go tools
          if ($bad) { throw "gofmt 未通过:`n$bad" }
          go vet ./backend/... ./tools/...
          if ($LASTEXITCODE -ne 0) { throw "go vet 失败" }
          go build ./backend/... ./tools/...
          if ($LASTEXITCODE -ne 0) { throw "go build 失败" }

      - name: Wails package (build + NSIS installer)
        shell: pwsh
        # v3 用 Taskfile 驱动：windows:package 先 build 出便携 exe，再用 makensis 打成安装器。
        # 产物落在仓库根的 bin/：OhMyPiDesktop.exe 与 OhMyPiDesktop-amd64-installer.exe。
        run: wails3 package

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path $env:EXE)) { throw "wails build 没产出 $([System.IO.Path]::GetFileName($env:EXE))" }
          $exeMB = (Get-Item $env:EXE).Length / 1MB
          if ($exeMB -lt 3) { throw ("$([System.IO.Path]::GetFileName($env:EXE)) 只有 {0:N1} MB，构建产物疑似不完整" -f $exeMB) }
          Write-Host ("Artifact OK (exe {0:N1} MB)" -f $exeMB)
          if (-not (Test-Path $env:INSTALLER)) { throw "wails package 没产出安装器 $([System.IO.Path]::GetFileName($env:INSTALLER))" }
          $instMB = (Get-Item $env:INSTALLER).Length / 1MB
          Write-Host ("Artifact OK (installer {0:N1} MB)" -f $instMB)

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ohmypidesktop-windows-debug
          # v3 的产物在仓库根的 bin/（build/bin/ 是 v2 的位置，已经不用了）。
          path: bin/
          retention-days: 7

      - name: Create GitHub Release
        # 触发条件已是 tag，这里再判一次：防「tag 被事后移动」时产物与版本号对不上。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: OhMyPiDesktop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            bin/OhMyPiDesktop.exe
            bin/OhMyPiDesktop-amd64-installer.exe
